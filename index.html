function R(status,title,metrics,note,formula,visual='',data=null){return{status,title,metrics,note,formula,visual,data}}
function standardRaster(w,h){return w===1280&&h===720?'720p':w===1920&&h===1080?'1080p':w===3840&&h===2160?'UHD 4K':null}
function ledProcessing(w,h,std){let mp=w*h/1e6,over4k=w>3840||h>2160||mp>8.2944;if(std)return{short:'Standard raster',level:'standard',hardware:'LED controller / processor',note:`The ${std} native raster matches a standard source format. An LED controller/processor is still required for receiving-card mapping. A separate upstream scaler is normally optional unless the system needs switching, windowing, image rotation or format conversion.`};if(over4k)return{short:'Multi-output processing',level:'multi',hardware:'Multi-output LED processor or media server',note:`The ${n(w,0)} × ${n(h,0)} canvas exceeds a single UHD 4K raster. Provide a multi-output LED processor, presentation processor or media server that can divide the canvas across synchronized outputs. Verify total pixel capacity, maximum width/height per output, output count, custom EDID, frame rate, bit depth and redundancy.`};return{short:'Custom-raster scaling',level:'custom',hardware:'LED video processor with scaler',note:`The ${n(w,0)} × ${n(h,0)} canvas is not 720p, 1080p or UHD 4K. Provide an LED video processor/scaler that supports custom EDID and pixel-to-pixel canvas mapping. Feed it a standard source raster and scale/crop the image deliberately; do not rely on the source device to discover the LED canvas correctly.`}}
function screenSvg(w,h){let ratio=w/h,W=300,H=Math.min(180,300/ratio);return `<svg viewBox="0 0 340 220"><rect x="20" y="15" width="300" height="${H}" rx="5" fill="#c9ff3d18" stroke="#c9ff3d"/><text x="170" y="${25+H/2}" text-anchor="middle" fill="#c9ff3d" font-size="18">${n(w,1)} × ${n(h,1)} in</text></svg>`}

function exportLedExcel(){let lr=state.lastResult;if(!lr||lr.tool!=='led'||!lr.result.data)return;let p=state.projects.find(x=>x.id===state.project),blob=buildLedWorkbook(lr.values,lr.result.data,p),a=document.createElement('a'),url=URL.createObjectURL(blob),safe=(p?.name||'Project').replace(/[^a-z0-9]+/gi,'_');a.href=url;a.download=`LED_Canvas_${safe}.xlsx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Excel report exported')}
function renderHistory(){let p=state.projects.find(p=>p.id===state.project),rows=state.history.filter(h=>h.project===state.project);$('#pageTitle').textContent='Project & History';$('#content').innerHTML=`<section class="card"><div class="result-top"><div><div class="eyebrow">Current project</div><h2>${esc(p?.name||'General')}</h2><p style="color:var(--muted)">${esc([p?.number,p?.room,p?.engineer].filter(Boolean).join(' · ')||'Unsaved workspace')}</p></div><div class="actions no-print"><button class="btn" id="importBtn">Import Backup</button><button class="btn primary" id="projectExport">Export Project</button></div></div><div class="section-title"><h3>Saved calculations</h3><p>${rows.length} records</p></div><div class="history-list">${rows.length?rows.map(h=>`<div class="history-row"><div class="calc-icon">${tool(h.tool)?.icon||'•'}</div><div><b>${esc(h.toolName)}</b><div style="color:var(--muted)">${esc(h.result.title)} · ${esc(h.result.metrics.slice(0,2).map(x=>x.join(': ')).join(' · '))}</div></div><span class="when">${new Date(h.date).toLocaleString()}</span><button class="icon-btn no-print" data-del="${h.id}">×</button></div>`).join(''):'<div class="empty-state">No calculations have been saved to this project yet.</div>'}</div></section>`;$('#projectExport').onclick=exportProject;$('#importBtn').onclick=()=>$('#importFile').click();$$('[data-del]').forEach(b=>b.onclick=()=>{state.history=state.history.filter(h=>h.id!==b.dataset.del);persist();renderHistory()})}
function exportData(data,name){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportProject(){let p=state.projects.find(p=>p.id===state.project);exportData({app:'AV Toolkit 2.4',exported:new Date().toISOString(),project:p,calculations:state.history.filter(h=>h.project===state.project)},`AVT_${(p?.name||'Project').replace(/[^a-z0-9]+/gi,'_')}.json`)}
function exportAll(){exportData({app:'AV Toolkit 2.4',version:2.4,exported:new Date().toISOString(),projects:state.projects,history:state.history,favorites:state.favorites},'AV_Toolkit_2_4_Backup.json')}
function importData(file){let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(d.projects&&d.history){state.projects=d.projects;state.history=d.history;state.favorites=d.favorites||state.favorites}else if(d.project&&d.calculations){let id='p_'+Date.now(),p={...d.project,id};state.projects.push(p);state.history.push(...d.calculations.map(h=>({...h,project:id,projectName:p.name})));state.project=id}else throw Error();persist();render();toast('Backup imported')}catch{toast('That file is not a valid toolkit backup')}};r.readAsText(file)}
function newProject(){let id='p_'+Date.now(),p={id,name:$('#projectName').value.trim()||'Untitled Project',number:$('#projectNumber').value.trim(),room:$('#projectRoom').value.trim(),engineer:$('#projectEngineer').value.trim()};state.projects.push(p);state.project=id;persist();$('#projectModal').classList.remove('open');render();toast('Project created')}
function debounce(fn,ms){let x;return()=>{clearTimeout(x);x=setTimeout(fn,ms)}}
$('#search').oninput=e=>renderNav(e.target.value);$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#newProjectBtn').onclick=()=>$('#projectModal').classList.add('open');$('#createProject').onclick=newProject;$$('[data-close]').forEach(b=>b.onclick=()=>$('#projectModal').classList.remove('open'));$('#projectSelect').onchange=e=>{state.project=e.target.value;persist();render()};$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';persist();render()};$('#exportBtn').onclick=exportAll;$('#importFile').onchange=e=>e.target.files[0]&&importData(e.target.files[0]);render();
</script></body></html>
